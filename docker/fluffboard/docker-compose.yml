services:
  fluffboard:
    image: docker.barkfluff.com:5000/fluffboard:latest
    container_name: fluffboard
    restart: always
    # 8080 — порт образа aspnet. Наружу порт публикуется только на loopback: снаружи доска
    # доступна через nginx, а он на сервере в network_mode: host и видит 127.0.0.1 хоста.
    ports:
      - "127.0.0.1:${FLUFFBOARD_PORT}:8080"
    # Настройки приходят переменными окружения: backend читает их напрямую, поэтому файл .env
    # внутрь контейнера монтировать не нужно.
    env_file:
      - .env
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # База в томе, а не в образе: иначе пользователи доски пересоздавались бы при каждом обновлении.
      Board__DatabasePath: /app/data/fluffboard.db
    networks:
      - fluffboard-network
    volumes:
      - fluffboard_data:/app/data

networks:
  # Общей сети с nginx нет и быть не может: он в network_mode: host, такой контейнер
  # ни к какой docker-сети не подключается. Связь идёт через loopback хоста.
  fluffboard-network:
    driver: bridge

volumes:
  fluffboard_data:
