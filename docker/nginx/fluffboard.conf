# fluffboard.example.com — Kanban-доска. Отдельного upstream для статики нет: собранный клиент
# отдаёт сам backend, поэтому у страницы и у /api один origin.
#
# Конфигурация кладётся в conf.d того nginx, который держит 443 на сервере.

upstream fluffboard_app {
    # nginx на сервере работает в network_mode: host, поэтому к доске он ходит не по имени
    # контейнера, а на loopback хоста. Порт — FLUFFBOARD_PORT из docker/fluffboard/.env.
    server 127.0.0.1:8080;
}

server {
    listen 80;
    server_name fluffboard.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name fluffboard.example.com;

    ssl_certificate     /etc/nginx/certs/fluffboard-crt.pem;
    ssl_certificate_key /etc/nginx/certs/fluffboard-key.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    # Имя зоны уникальное: у соседних сайтов этого nginx уже объявлена shared:SSL, и второе
    # объявление того же имени с другим размером роняет конфигурацию с [emerg].
    ssl_session_cache shared:fluffboard_SSL:10m;
    ssl_session_timeout 10m;
    ssl_prefer_server_ciphers on;

    # Картинка в описании задачи ограничена 5 МБ на стороне backend; дефолтный 1m у nginx
    # обрезал бы её раньше, и загрузка падала бы с 413.
    client_max_body_size 6m;

    location / {
        proxy_pass http://fluffboard_app;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
    }
}
