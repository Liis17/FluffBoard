name: "🚀 FluffBoard CI/CD"

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'Dockerfile.slim'
      - '.dockerignore'
      - '.github/workflows/build-fluffboard.yml'
      - '.github/actions/docker-version/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: "🐳 Сборка и публикация FluffBoard"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Клиент собирается внутри Docker, поэтому Node на runner не нужен — только .NET.
      - name: "⚙️ Установка .NET 10 SDK"
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: "⚙️ dotnet publish (Linux Release)"
        run: |
          dotnet publish backend/backend.csproj \
            -c Release \
            -o ./publish \
            /p:UseAppHost=false

      - name: Login to Private Registry
        uses: docker/login-action@v2
        with:
          registry: docker.barkfluff.com:5000
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Compute version
        id: vars
        uses: ./.github/actions/docker-version
        with:
          image: fluffboard
          registry-username: ${{ secrets.REGISTRY_USERNAME }}
          registry-password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and Push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile.slim
          push: true
          tags: ${{ steps.vars.outputs.tags }}

      - name: "🏷️ Опубликованный тег"
        run: echo "${{ steps.vars.outputs.tag_version }}"
